name: Deploy on k8s

on:
  workflow_dispatch:
    inputs:
      build_new:
        description: 'Build new image (provide version)'
        type: boolean
        default: false
      update_existing:
        description: 'Update deployment with existing image'
        type: boolean
        default: false
      image_version:
        description: 'Docker image version (required if build_new is checked)'
        required: false
        type: string

env:
  # K8S essential
  KTX_JAR_PATH: ./frame-parties-server/build/libs/*.jar
  KTX_APP_NAME: 'frame-parties'
  KTX_IMAGE_NAME: 'frame-parties'
  KTX_SVC_PORT: '30083'
  # K8S secrets
  DB_ADDRESS: ${{ secrets.DB_ADDRESS }}
  DB_NAME: ${{ secrets.DB_NAME }}
  DB_USER: ${{ secrets.DB_USER }}
  DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
  KAFKA_ADDRESS: ${{ secrets.KAFKA_ADDRESS }}
  KAFKA_USER: ${{ secrets.KAFKA_USER }}
  KAFKA_PASSWORD: ${{ secrets.KAFKA_PASSWORD }}
  KAFKA_TOPIC: ${{ secrets.KAFKA_TOPIC }}

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Validate inputs
        run: |
          if ${{ inputs.build_new }} && ${{ inputs.update_existing }}; then
            echo "Error: Cannot select both 'Build new' and 'Update'"
            exit 1
          fi
          if ${{ inputs.build_new }} && [ -z "${{ inputs.image_version }}" ]; then
            echo "Error: Image version is required when 'Build new' is selected"
            exit 1
          fi

      - name: Sync repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        if: ${{ inputs.build_new || (!inputs.build_new && !inputs.update_existing) }}
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make gradlew executable
        if: ${{ inputs.build_new || (!inputs.build_new && !inputs.update_existing) }}
        run: chmod +x ./gradlew

      - name: Build with Gradle
        if: ${{ inputs.build_new || (!inputs.build_new && !inputs.update_existing) }}
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./gradlew build
          mv $KTX_JAR_PATH ./docker/app.jar

      - name: Get current image version
        id: get_version
        run: |
          if ${{ inputs.build_new }}; then
            # Use provided version when building new
            echo "KTX_IMAGE_VERSION=${{ inputs.image_version }}" >> $GITHUB_ENV
          elif ${{ inputs.update_existing }}; then
            # Use current deployment version when updating
            CURRENT_VERSION=$(minikube kubectl -- get deployment $KTX_APP_NAME -o=jsonpath='{.spec.template.spec.containers[0].image}' | cut -d ':' -f 2)
            echo "KTX_IMAGE_VERSION=$CURRENT_VERSION" >> $GITHUB_ENV
          else
            # Auto-increment version when neither option is selected
            CURRENT_VERSION=$(minikube kubectl -- get deployment $KTX_APP_NAME -o=jsonpath='{.spec.template.spec.containers[0].image}' | cut -d ':' -f 2)
            if [[ $CURRENT_VERSION == *"_"* ]]; then
              # If version already has underscore, increment the suffix
              BASE_VERSION=${CURRENT_VERSION%_*}
              SUFFIX=${CURRENT_VERSION##*_}
              NEW_SUFFIX=$((SUFFIX + 1))
              NEW_VERSION="${BASE_VERSION}_${NEW_SUFFIX}"
            else
              # If no underscore, add _0 suffix
              NEW_VERSION="${CURRENT_VERSION}_0"
            fi
            echo "KTX_IMAGE_VERSION=$NEW_VERSION" >> $GITHUB_ENV
            echo "Previous version was $CURRENT_VERSION, new version is $NEW_VERSION"
          fi

      - name: Build Docker image
        if: ${{ inputs.build_new || (!inputs.build_new && !inputs.update_existing) }}
        run: |
          eval $(minikube docker-env)
          docker build -t $KTX_IMAGE_NAME:$KTX_IMAGE_VERSION ./docker

      - name: Deploy to k8s
        run: |
          envsubst < ./k8s/configmap.tpl.yaml > ./k8s/configmap.yaml
          minikube kubectl -- apply -f ./k8s/configmap.yaml
          KTX_CONFIG_HASH=$(sha256sum ./k8s/configmap.yaml | cut -d ' ' -f 1)
          
          envsubst < ./k8s/deployment.tpl.yaml > ./k8s/deployment.yaml
          envsubst < ./k8s/service.tpl.yaml > ./k8s/service.yaml
          
          minikube kubectl -- apply -f ./k8s/deployment.yaml
          minikube kubectl -- apply -f ./k8s/service.yaml

      - name: Remove old Docker images
        if: ${{ inputs.build_new || (!inputs.build_new && !inputs.update_existing) }}
        run: |
          eval $(minikube docker-env)
          docker images | grep "$KTX_IMAGE_NAME" | grep -v "$KTX_IMAGE_VERSION" | awk '{print $3}' | xargs docker rmi || true

      - name: Clean up workspace
        if: always()
        run: rm -rf ${{ github.workspace }}/*
